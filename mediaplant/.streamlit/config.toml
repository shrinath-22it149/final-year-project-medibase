[theme]
primaryColor = "#2E8B57"
backgroundColor = "#FAFFFE"
secondaryBackgroundColor = "#F0FFF4"
textColor = "#1a1a2e"
font = "sans serif"

[server]
enableCORS = true
enableXsrfProtection = false
headless = true
port = 8501
maxUploadSize = 10

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[logger]
level = "error"

[runner]
fastReruns = true
